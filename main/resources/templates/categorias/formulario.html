<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Categoría</title>

    <link rel="stylesheet"
          th:href="@{/css/categorias.css}">

</head>

<body>

<div class="container">

    <div class="form-card">

        <!-- CAMBIAMOS EL TEXTO DEPENDIENDO DE SI EXISTE ID -->

        <h1 th:if="${categoria.id == null}">
            ➕ Nueva categoría
        </h1>

        <h1 th:unless="${categoria.id == null}">
            ✏️ Editar categoría
        </h1>


        <p>
            Crea una categoría para organizar mejor tus tareas.
        </p>


        <!-- FORMULARIO -->

        <form th:action="@{/categorias/categoriaSave}"
              th:object="${categoria}"
              method="post">


            <!-- NOMBRE -->

            <div class="form-group">

                <label for="nombre">
                    Nombre de la categoría
                </label>

                <input type="text"
                       id="nombre"
                       th:field="*{nombre}"
                       placeholder="Ej. Trabajo"
                       required>

            </div>


            <!-- BOTONES -->

            <div class="form-actions">

                <button type="submit"
                        class="btn btn-primary">
                    💾 Guardar
                </button>

                <a th:href="@{/categorias}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
